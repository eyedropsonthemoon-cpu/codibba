!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Codibba App Icon</title>
<link rel="shortcut icon" href="codibba-favicon.ico" type="image/x-icon">
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: #FDFBF7; /* Exact cream background */
display: flex;
align-items: center;
justify-content: center;
min-height: 100vh;
color: #1A365D;
}
.container {
display: flex;
max-width: 1000px;
width: 90%;
align-items: center;
justify-content: space-between;
gap: 60px;
}
.content-left {
flex: 1;
}
.content-left h1 {
font-family: 'Georgia', serif;
font-size: 3.5rem;
color: #D4AF37; /* Beautiful Gold/Tan */
line-height: 1.1;
font-weight: 400;
margin-bottom: 5px;
}
.content-left h2 {
font-family: -apple-system, sans-serif;
color: #1A365D; /* Dark Navy */
font-weight: 800;
font-size: 3.2rem;
margin-bottom: 30px;
}
.button-group {
display: flex;
gap: 15px;
}
.btn-primary {
background-color: #1A365D;
color: white;
padding: 12px 24px;
border-radius: 6px;
text-decoration: none;
font-weight: 600;
font-size: 0.95rem;
}
.btn-secondary {
background-color: transparent;
color: #1A365D;
padding: 12px 24px;
border-radius: 6px;
text-decoration: none;
font-weight: 600;
font-size: 0.95rem;
border: 2px solid #E2E8F0;
}
.image-right {
flex: 1;
display: flex;
justify-content: center;
}
.icon-card {
background: linear-gradient(135deg, #1A365D, #2A4365);
padding: 40px;
border-radius: 24px;
box-shadow: 0 20px 40px rgba(0,0,0,0.1);
display: flex;
justify-content: center;
align-items: center;
width: 380px;
height: 380px;
}
.icon-card img {
width: 100%;
height: 100%;
object-fit: contain;
}
</style>
</head>
<body>

<div class="container">
<div class="content-left">
<h1>The Codibba</h1>
<h2>App Icon</h2>
<div class="button-group">
<a href="#" class="btn-primary">Download Asset</a>
<a href="#" class="btn-secondary">View Details</a>
</div>
</div>

<div class="image-right">
<div class="icon-card">
<img src="codibba-icon-original-512.png" onerror="this.src='appicon111/codibba-icon-original-512.png'" alt="Codibba Icon">
</div>
</div>
</div>

</body>
</html>
